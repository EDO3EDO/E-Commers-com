<div class=" container bg-main-light p-4 shadow my-5">
      <h2>Shopping Now :</h2>
      <p>TotalPrice:{{Cart?.totalCartPrice}}</p>

      @for (Cart of Cart?.IProduct; track $index) {
        <div class="row">
        <div class="col-12">
          <img [src]="Cart.imageCover" [alt]="Cart.title">
          <p>{{Cart.price}}</p>
        </div>
        </div>
      }

</div>
